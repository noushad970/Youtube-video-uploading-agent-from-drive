version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youtube-ai-agent-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/agent.db
      - DOWNLOAD_DIRECTORY=/app/data/videos
      - THUMBNAIL_DIRECTORY=/app/data/thumbnails
      - LOG_DIRECTORY=/app/data/logs
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: youtube-ai-agent-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
